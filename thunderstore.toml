# Thunderstore CLI configuration.
#
# NOTE ON SCOPE: release.ps1 publishes a PREBUILT zip (built by package_thunderstore.bat) via
# `tcli publish --file`. That zip carries its own manifest.json, which is what Thunderstore
# reads for the description and dependency list. This file therefore exists only to tell tcli
# WHERE to publish (repository + communities) and to identify the package.
#
# Deliberately do NOT duplicate the description or dependencies here - dist/thunderstore/
# manifest.json is the single source of truth for those, and release.ps1 passes the version
# from the repo-root VERSION file on the command line. Duplicating them would recreate exactly
# the drift problem the VERSION file was introduced to remove.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "Therunner"
name = "SlowSailingBagpipes"
# Placeholder only. release.ps1 always passes --package-version from the VERSION file,
# which overrides this value.
versionNumber = "0.0.0"
description = "Play custom bagpipe music while rowing your Viking longship!"
websiteUrl = "https://github.com/mataeo-eh/Valheim-Slow-Sailing-Bagpipes-Mod"
containsNsfwContent = false

[build]
icon = "./dist/thunderstore/icon.png"
readme = "./dist/thunderstore/README.md"
outdir = "./dist/tcli"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]
