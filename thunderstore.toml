# Thunderstore CLI configuration.
#
# NOTE ON SCOPE: release.ps1 publishes a PREBUILT zip (built by package_thunderstore.bat) via
# `tcli publish --file`. That zip carries its own manifest.json, which is what Thunderstore
# reads for the description and dependency list. This file therefore exists only to tell tcli
# WHERE to publish (repository + communities) and to identify the package.
#
# tcli does not accept --package-version alongside --file, so release.ps1 stamps the
# versionNumber below from the repo-root VERSION file immediately before publishing - the same
# way it stamps dist/thunderstore/manifest.json. Do not edit versionNumber by hand.
#
# dist/thunderstore/manifest.json remains the source of truth for the description and the
# dependency list; the copy of the description here is only what tcli requires to parse this
# file. Duplicating the dependency list would recreate exactly the drift problem the VERSION
# file was introduced to remove.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "Therunner"
name = "SlowSailingBagpipes"
# Stamped by release.ps1 from the repo-root VERSION file. Do not edit by hand.
versionNumber = "1.1.0"
description = "Multiplayer-compatible rowing music for helmsmen and passengers. Client-side: each player needs the mod and audio tracks to hear bagpipes; unmodded players keep vanilla music."
websiteUrl = "https://github.com/mataeo-eh/Valheim-Slow-Sailing-Bagpipes-Mod"
containsNsfwContent = false

[build]
icon = "./dist/thunderstore/icon.png"
readme = "./dist/thunderstore/README.md"
outdir = "./dist/tcli"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]
